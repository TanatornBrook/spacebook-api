global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: spacebook

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: spacebook-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["spacebook-prod:3000"]
        labels:
          environment: production

  - job_name: spacebook-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["spacebook-staging:3000"]
        labels:
          environment: staging

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
