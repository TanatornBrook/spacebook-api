sonar.projectKey=spacebook-api
sonar.projectName=SpaceBook API
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage produced by the Test stage is imported so SonarQube can gate on it.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Generated and third-party files are excluded so the metrics describe code we
# actually wrote and maintain.
sonar.exclusions=node_modules/**,coverage/**,reports/**,dist/**,scripts/**
sonar.coverage.exclusions=tests/**,src/server.js,scripts/**
