services:
  spacebook-prod:
    image: ${IMAGE_NAME:-spacebook-api}:${RELEASE_TAG:-stable}
    container_name: spacebook-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${PROD_JWT_SECRET:-production-secret-set-me-in-jenkins}
      ADMIN_PASSWORD: ${PROD_ADMIN_PASSWORD:-ProdAdmin123!}
      APP_VERSION: ${RELEASE_VERSION:-1.0.0}
    ports:
      - "3000:3000"
    networks:
      - spacebook-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  spacebook-net:
    external: true
